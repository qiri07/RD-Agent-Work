name: Daily Strategy Screening

on:
  schedule:
    # 北京时间每天 10:00（UTC 02:00）
    - cron: "0 2 * * *"
  workflow_dispatch:  # 支持手动触发

jobs:
  strategy-screening:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q pandas numpy scipy loguru tabulate

      - name: Run 8-strategy screening
        run: python scripts/screening_strategies.py --top-n 20 --push-feishu
